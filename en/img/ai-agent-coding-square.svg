<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200pt" height="200pt" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">AI agent for coding workflow</title>
<desc id="desc">Compact square illustration showing an AI agent generating code and input files for eMachineSim.</desc>
<defs>
<linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="58%" stop-color="#B45309"/><stop offset="100%" stop-color="#78350F"/></linearGradient>
<linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1F2937"/></linearGradient>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.16"/></filter>
</defs>
<rect width="240" height="240" fill="none"/>
<circle cx="120" cy="108" r="82" fill="#FFF7ED" opacity="0.92"/>
<ellipse cx="120" cy="214" rx="84" ry="10" fill="#0F172A" opacity="0.10"/>

<!-- AI agent head -->
<g transform="translate(30 50)" filter="url(#softShadow)">
<rect x="18" y="30" width="76" height="66" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
<rect x="31" y="42" width="50" height="32" rx="12" fill="url(#screenGrad)"/>
<circle cx="45" cy="58" r="5" fill="#F59E0B"/><circle cx="67" cy="58" r="5" fill="#F59E0B"/>
<path d="M47 70c7 5 15 5 22 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
<path d="M56 30V16" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<circle cx="56" cy="12" r="8" fill="url(#copperGrad)" stroke="#FFFFFF" stroke-width="3"/>
<path d="M10 58H0M112 58h-10" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- Chat bubble -->
<g transform="translate(86 36)" filter="url(#softShadow)">
<rect x="0" y="0" width="86" height="48" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
<path d="M18 17h30M18 30h48" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
<path d="M14 45l-10 17 25-15z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" stroke-linejoin="round"/>
<circle cx="70" cy="16" r="9" fill="#7C3AED"/><path d="M66 16h8M70 12v8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- Code editor -->
<g transform="translate(108 92)" filter="url(#softShadow)">
<rect x="0" y="0" width="100" height="68" rx="13" fill="url(#screenGrad)"/>
<rect x="0" y="0" width="100" height="16" rx="13" fill="#111827" opacity="0.42"/>
<circle cx="13" cy="8" r="3" fill="#DC2626"/><circle cx="24" cy="8" r="3" fill="#F59E0B"/><circle cx="35" cy="8" r="3" fill="#16A34A"/>
<path d="M20 34l-10 9 10 9M48 30l-9 27M62 34l10 9-10 9" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Generated JSON file -->
<g transform="translate(42 138)" filter="url(#softShadow)">
<rect x="0" y="0" width="52" height="64" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
<path d="M13 19h26M13 32h20M13 45h27" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
<rect x="27" y="45" width="18" height="12" rx="4" fill="#F59E0B"/>
<text x="26" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="800" fill="#92400E">JSON</text>
</g>
<path d="M87 118c13 10 20 10 33 2" fill="none" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
<path d="M117 113l17 4-13 12z" fill="#B45309"/>
<path d="M91 164c18 4 43 1 63-13" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
<circle cx="160" cy="148" r="8" fill="#D97706"/>

</svg>
