<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200pt" height="200pt" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">eMachineSim analysis functions</title>
  <desc id="desc">Compact square illustration for eMachineSim analysis functions, showing a rotor, thermal network, vibration waveform, and solver output.</desc>
  <defs>
    <linearGradient id="copperGrad" x1="34" y1="34" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="none"/>
  <ellipse cx="120" cy="214" rx="84" ry="10" fill="#0F172A" opacity="0.10"/>

  <!-- soft background -->
  <circle cx="95" cy="103" r="78" fill="#FFF7ED" opacity="0.95"/>
  <path d="M30 105c18-48 70-76 118-58 26 10 48 31 60 57" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="7 9" opacity="0.9"/>
  <path d="M204 105l14-7-3 15z" fill="#CBD5E1" opacity="0.9"/>

  <!-- motor rotor -->
  <g transform="translate(96 106)" filter="url(#softShadow)">
    <circle r="54" fill="#1F2937"/>
    <circle r="38" fill="url(#copperGrad)"/>
    <circle r="17" fill="#FFFFFF"/>
    <circle r="7" fill="#92400E"/>
    <g fill="#FFFFFF" opacity="0.95">
      <path d="M-5-37h10l4 20H-9z"/>
      <path d="M-5 37h10l4-20H-9z"/>
      <path d="M37-5v10l-20 4V-9z"/>
      <path d="M-37-5v10l20 4V-9z"/>
    </g>
    <path d="M-64-4c16-18 39-29 64-29 26 0 50 12 65 31" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <path d="M58-16l16 8-16 9c4-6 4-12 0-17z" fill="#F59E0B"/>
  </g>

  <!-- thermal network -->
  <g transform="translate(151 55)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 45h31M31 45V23M31 45v23M31 23h24M31 68h24" fill="none" stroke="#475569" stroke-width="4"/>
    <g fill="#F59E0B" stroke="#FFFFFF" stroke-width="4">
      <circle cx="0" cy="45" r="10"/>
      <circle cx="31" cy="45" r="10"/>
      <circle cx="55" cy="23" r="10"/>
      <circle cx="55" cy="68" r="10"/>
    </g>
    <path d="M-8 24c7-8 8-16 3-24M5 24c7-8 8-16 3-24M18 24c7-8 8-16 3-24" fill="none" stroke="#DC2626" stroke-width="4"/>
  </g>

  <!-- solver panel -->
  <g transform="translate(130 140)" filter="url(#softShadow)">
    <rect x="0" y="0" width="76" height="48" rx="10" fill="url(#panelGrad)"/>
    <rect x="10" y="12" width="23" height="24" rx="5" fill="#FFF7ED"/>
    <path d="M15 30l5-11 5 7 4-4 4 8" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 15h22M42 25h27M42 35h15" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- vibration wave -->
  <g transform="translate(40 164)">
    <path d="M0 16c9 0 9-16 18-16s9 32 18 32 9-32 18-32 9 16 18 16h18" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <circle cx="104" cy="16" r="7" fill="#D97706"/>
  </g>
</svg>
