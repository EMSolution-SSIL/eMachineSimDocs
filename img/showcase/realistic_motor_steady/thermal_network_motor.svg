<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Motor thermal equivalent circuit with axial end-space cooling</title>
  <desc id="desc">Concept diagram showing stator and rotor FEM heat sources connected to housing, shaft, gap coupling, and end-space-air cooling paths.</desc>
  <defs>
    <style>
      .wire { stroke:#111; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#111; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .node { fill:#111; stroke:#111; stroke-width:2; }
      .open { fill:#fff; stroke:#111; stroke-width:5; }
      .source { fill:#fff; stroke:#111; stroke-width:5; }
      .heatArrow { stroke:#111; stroke-width:6; fill:none; marker-end:url(#arrow); }
      .label { font-family:Arial, Helvetica, sans-serif; font-size:21px; fill:#111; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:17px; fill:#111; }
      .tiny { font-family:Arial, Helvetica, sans-serif; font-size:14px; fill:#333; }
      .tag { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#111; }
      .box { fill:#fff7ed; stroke:#d97706; stroke-width:2; rx:10; }
      .accent { stroke:#d97706; stroke-width:4; fill:none; stroke-linecap:round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" />
    </marker>
  </defs>

  <!-- Heat sources -->
  <circle class="source" cx="82" cy="116" r="48"/>
  <path class="heatArrow" d="M82 78 L82 129"/>
  <text class="tag" x="55" y="187">Q-S</text>
  <text class="tiny" x="22" y="210">BDF QVOL + coil loss</text>

  <circle class="source" cx="82" cy="394" r="48"/>
  <path class="heatArrow" d="M82 356 L82 407"/>
  <text class="tag" x="55" y="465">Q-R</text>
  <text class="tiny" x="38" y="488">rotor / PM heat</text>

  <!-- Stator radial path -->
  <line class="wire" x1="130" y1="116" x2="245" y2="116"/>
  <circle class="open" cx="258" cy="116" r="9"/>
  <text class="label" x="160" y="106">Stator FEM</text>
  <path class="wire" d="M268 116 L292 116 L302 84 L322 148 L342 84 L362 148 L382 84 L402 148 L416 116 L432 116"/>
  <text class="tag" x="311" y="65">FEMH-SR</text>
  <text class="tiny" x="293" y="184">stator radial to housing</text>
  <circle class="node" cx="454" cy="116" r="9"/>
  <text class="label" x="424" y="154">Housing</text>
  <path class="wire" d="M463 116 L486 116 L496 84 L516 148 L536 84 L556 148 L576 84 L596 148 L612 116 L630 116"/>
  <text class="tag" x="516" y="65">R-HA</text>
  <text class="tiny" x="500" y="184">housing to ambient</text>
  <circle class="open" cx="646" cy="116" r="9"/>
  <text class="label" x="666" y="124">Ambient</text>

  <!-- Rotor radial path -->
  <line class="wire" x1="130" y1="394" x2="245" y2="394"/>
  <circle class="open" cx="258" cy="394" r="9"/>
  <text class="label" x="164" y="384">Rotor FEM</text>
  <path class="wire" d="M268 394 L292 394 L302 362 L322 426 L342 362 L362 426 L382 362 L402 426 L416 394 L432 394"/>
  <text class="tag" x="311" y="455">FEMH-RR</text>
  <text class="tiny" x="306" y="482">rotor radial to shaft</text>
  <circle class="node" cx="454" cy="394" r="9"/>
  <text class="label" x="430" y="372">Shaft</text>
  <path class="wire" d="M463 394 L486 394 L496 362 L516 426 L536 362 L556 426 L576 362 L596 426 L612 394 L630 394"/>
  <text class="tag" x="516" y="455">R-SA</text>
  <text class="tiny" x="505" y="482">shaft to ambient</text>
  <circle class="open" cx="646" cy="394" r="9"/>
  <text class="label" x="666" y="402">Ambient</text>

  <!-- Gap coupling -->
  <path class="wire" d="M454 127 L454 172 L424 182 L484 202 L424 222 L484 242 L424 262 L484 282 L454 292 L454 383"/>
  <text class="tag" x="483" y="255">G-gap</text>
  <text class="tiny" x="490" y="278">h, k/gap, or Nu</text>

  <!-- End-space path box -->
  <rect class="box" x="710" y="178" width="220" height="168"/>
  <text class="tag" x="752" y="212">End space air</text>
  <text class="tiny" x="733" y="237">end bracket / oil /</text>
  <text class="tiny" x="756" y="257">refrigerant path</text>
  <circle class="node" cx="820" cy="296" r="9"/>
  <path class="thin" d="M829 296 L848 296 L856 274 L872 318 L888 274 L904 318 L912 296 L930 296"/>
  <text class="tag" x="858" y="265">R-EA</text>
  <circle class="open" cx="940" cy="296" r="7"/>
  <text class="small" x="858" y="337">to ambient</text>

  <!-- Stator end/coil-end equivalent path -->
  <path class="accent" d="M258 116 C360 42, 642 42, 742 188"/>
  <circle class="open" cx="742" cy="188" r="7"/>
  <text class="tag" x="470" y="35">FEMH-SE</text>
  <text class="small" x="402" y="57">stator end + coil-end equivalent</text>
  <path class="thin" d="M742 188 L780 188 L790 164 L806 212 L822 164 L838 212 L848 188 L870 188"/>
  <text class="tag" x="790" y="153">R-EH</text>
  <path class="thin" d="M870 188 C900 140, 720 104, 646 116"/>
  <text class="tiny" x="815" y="119">end space to housing</text>

  <!-- Rotor end path -->
  <path class="accent" d="M258 394 C368 480, 646 480, 742 330"/>
  <circle class="open" cx="742" cy="330" r="7"/>
  <text class="tag" x="472" y="512">FEMH-RE</text>
  <text class="small" x="426" y="490">rotor end to end space</text>

  <!-- Legend -->
  <text class="tiny" x="24" y="24">Concept only: coefficients are tuned in input JSON; not a calibrated compressor motor model.</text>
</svg>
